services:
  # 1. MySQL Veritabanı
  db:
    image: mysql:8.0
    container_name: listify_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-listify_root_secret_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-listify}
      MYSQL_USER: ${MYSQL_USER:-listify_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-listify_user_secure_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - listify_net

  # 2. REST API Servisi (shares-api)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: listify_api
    restart: unless-stopped
    environment:
      PORT: 8080
      NODE_ENV: ${NODE_ENV:-production}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-listify_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-listify_user_secure_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-listify}
      TTL_HOURS: ${TTL_HOURS:-48}
      CLEANUP_CRON_SCHEDULE: ${CLEANUP_CRON_SCHEDULE:-"0 * * * *"}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - listify_net

  # 3. Next.js Web Uygulaması (SSR Landing + CSR Local-First)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: listify_web
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    depends_on:
      - api
    networks:
      - listify_net

  # 4. Nginx Ters Vekil (Reverse Proxy - Port 80)
  proxy:
    image: nginx:alpine
    container_name: listify_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - listify_net

networks:
  listify_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
