services:
  # 1. MySQL Veritabanı
  db:
    image: mysql:8.0
    container_name: listify_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-listify_root_secret_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-listify}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-listify_user_secure_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - listify_net

  # 2. REST API Servisi (shares-api)
  api:
    image: ghcr.io/abdulbakidemir/listify-api:latest
    container_name: listify_api
    restart: unless-stopped
    environment:
      PORT: 8080
      NODE_ENV: ${NODE_ENV:-production}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-listify_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-listify_user_secure_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-listify}
      TTL_HOURS: ${TTL_HOURS:-48}
      CLEANUP_CRON_SCHEDULE: ${CLEANUP_CRON_SCHEDULE:-"0 * * * *"}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - listify_net
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.listify-api.rule=Host(`api.abdulbakidemir.com.tr`)"
      - "traefik.http.routers.listify-api.entrypoints=websecure"
      - "traefik.http.routers.listify-api.tls.certresolver=myresolver"
      - "traefik.http.services.listify-api.loadbalancer.server.port=8080"

  # 3. Next.js Web Uygulaması
  web:
    image: ghcr.io/abdulbakidemir/listify-web:latest
    container_name: listify_web
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.abdulbakidemir.com.tr/api/v1
    depends_on:
      - api
    networks:
      - listify_net
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      - "traefik.http.routers.listify-web.rule=Host(`app.abdulbakidemir.com.tr`)"
      - "traefik.http.routers.listify-web.entrypoints=websecure"
      - "traefik.http.routers.listify-web.tls.certresolver=myresolver"
      - "traefik.http.services.listify-web.loadbalancer.server.port=3000"

networks:
  listify_net:
    driver: bridge
  proxy-net:
    external: true

volumes:
  mysql_data:
    driver: local